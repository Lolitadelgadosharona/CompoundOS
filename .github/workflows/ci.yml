name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Docker Compose version
        run: docker compose version
      - name: Validate Docker Compose configuration
        run: docker compose config
      - name: Verify localhost-only host bindings
        run: |
          docker compose config --format json > /tmp/compose.json
          python - <<'PY'
          import json

          with open("/tmp/compose.json", encoding="utf-8") as config_file:
              config = json.load(config_file)

          expected = {
              "web": ("127.0.0.1", 3000, 3000),
              "api": ("127.0.0.1", 8000, 8000),
              "postgres": ("127.0.0.1", 5432, 5432),
              "redis": ("127.0.0.1", 6379, 6379),
          }
          for service_name, expected_binding in expected.items():
              ports = config["services"][service_name].get("ports", [])
              bindings = {
                  (port.get("host_ip"), int(port["published"]), int(port["target"]))
                  for port in ports
              }
              if bindings != {expected_binding}:
                  raise SystemExit(
                      f"{service_name} ports must equal {expected_binding}, got {sorted(bindings)}"
                  )
          PY

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compoundos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: compoundos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compoundos -d compoundos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://compoundos:ci-only-password@127.0.0.1:5432/compoundos_test
      TEST_DATABASE_URL: postgresql+psycopg://compoundos:ci-only-password@127.0.0.1:5432/compoundos_test
      COMPOUNDOS_REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run database migrations
        run: |
          alembic upgrade head
          alembic current
      - name: Run backend lint
        run: ruff check apps tests
      - name: Verify PostgreSQL test gate configuration
        run: test -n "$TEST_DATABASE_URL"
      - name: Run backend tests without PostgreSQL marker
        run: pytest -q -m "not postgres"
      - name: Run real PostgreSQL tests
        run: pytest -q -m postgres -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@10.9.8
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend type check
        run: npm run type-check
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev
